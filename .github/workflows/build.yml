name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show files & make gradlew runnable
        run: |
          ls -la
          chmod +x gradlew
          ./gradlew --version

      - name: Build & list outputs
        run: |
          ./gradlew clean build
          find . -name "*.apk"

      - name: Upload all found APKs
        uses: actions/upload-artifact@v4
        with:
          name: Built-APKs
          path: ./**/build/outputs/apk/**/*.apk
